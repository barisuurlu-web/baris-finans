<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barış Finans</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">KİŞİSEL FİNANS</p>
        <h1>Barış Finans</h1>
        <p class="muted">Gelirlerini ve giderlerini tek yerden takip et.</p>
      </div>
      <div class="month">Ekim 2026</div>
    </header>

    <section class="cards">
      <article><span>Toplam Gelir</span><strong id="income">₺0</strong></article>
      <article><span>Toplam Gider</span><strong id="expense">₺0</strong></article>
      <article><span>Kalan</span><strong id="balance">₺0</strong></article>
    </section>

    <section class="panel">
      <h2>Hızlı Kayıt</h2>
      <form id="transactionForm">
        <div class="row">
          <label>Tutar
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="850" required>
          </label>
          <label>Tür
            <select id="type">
              <option value="expense">Gider</option>
              <option value="income">Gelir</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Kategori
            <select id="category">
              <option>Market</option>
              <option>Yakıt</option>
              <option>Dışarıda Yemek</option>
              <option>Fatura</option>
              <option>Kira</option>
              <option>Aidat</option>
              <option>Motor</option>
              <option>Eğlence</option>
              <option>Kişisel</option>
              <option>Diğer</option>
            </select>
          </label>
          <label>Kim?
            <select id="person">
              <option>Barış</option>
              <option>Eşim</option>
              <option>Ortak</option>
            </select>
          </label>
        </div>
        <label>Not
          <input id="note" type="text" placeholder="Motorla gezi, market alışverişi...">
        </label>
        <button type="submit">Kaydet</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-title">
        <h2>Son İşlemler</h2>
        <button id="clear" class="danger" type="button">Tümünü Sil</button>
      </div>
      <div id="transactions" class="transactions">
        <p class="muted">Henüz kayıt yok.</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
